[package]
name = "macpigeon-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
icloud_auth = { path = "../vendor/apple-private-apis/icloud-auth" }
omnisette = { path = "../vendor/apple-private-apis/omnisette" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zeroize = "1"
plist = "1"
openssl = "0.10"
flate2 = "1"
base64 = "0.21"
reqwest = { version = "0.11", features = ["rustls-tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1"
